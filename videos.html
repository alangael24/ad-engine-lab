<!doctype html>

  <title>Videos de formatos — CreativeRush AI</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080808;
      --card: #141414;
      --line: #2a2a2a;
      --text: #f0f0f0;
      --muted: #a0a0a0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
    }
    header {
      padding: 32px 20px 12px;
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 {
      font-size: clamp(28px, 4vw, 52px);
      line-height: 1;
      margin: 0 0 8px;
    }
    p {
      color: var(--muted);
      margin: 0;
    }
    main {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 18px;
      padding: 24px 20px 48px;
      max-width: 1200px;
      margin: 0 auto;
    }
    article {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
    }
    h2 {
      font-size: 20px;
      margin: 14px 16px 10px;
    }
    iframe {
      width: 100%;
      aspect-ratio: 9 / 16;
      border: 0;
      display: block;
      background: #000;
    }
  </style>
