<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Comparar LP — Antes vs. Ahora</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #09090b;
        color: #fff;
      }
      * { box-sizing: border-box; }
      body { margin: 0; overflow: hidden; }
      .toolbar {
        height: 58px;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        align-items: center;
        gap: 10px;
        padding: 8px 14px;
        background: #0c0c0f;
        border-bottom: 1px solid #34343b;
      }
      .version {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 12px;
        min-width: 0;
      }
      .version:nth-child(2) { justify-content: center; }
      .version:last-child { justify-content: flex-end; }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 7px 11px;
        border: 1px solid #4b4b55;
        border-radius: 999px;
        background: #17171c;
        font-size: 12px;
        font-weight: 900;
        letter-spacing: .08em;
      }
      .oldest .badge::before, .before .badge::before, .after .badge::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }
      .oldest .badge::before { background: #ff7b00; }
      .before .badge::before { background: #ffbe0b; }
      .after .badge::before { background: #ff2cad; }
      .open {
        color: #d9d9df;
        font-size: 12px;
        text-decoration: none;
        white-space: nowrap;
      }
      .open:hover { color: #fff; text-decoration: underline; }
      .compare {
        height: calc(100vh - 58px);
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        background: #2b2b31;
        gap: 2px;
      }
      .pane { position: relative; min-width: 0; background: #fff; }
      iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
      @media (max-width: 800px) {
        .toolbar { gap: 4px; padding-inline: 6px; }
        .badge { padding-inline: 7px; font-size: 9px; }
        .open { display: none; }
      }
    </style>
  </head>
  <body>
    <header class="toolbar">
      <div class="version oldest">
        <span class="badge">30 CRÉDITOS</span>
        <a
          class="open"
          href="https://2ed94ed6.ad-engine-lab.pages.dev/"
          target="_blank"
          rel="noopener"
          >abrir ↗</a
        >
      </div>
      <div class="version before">
        <span class="badge">PLANES</span>
        <a
          class="open"
          href="https://ea084497.ad-engine-lab.pages.dev/"
          target="_blank"
          rel="noopener"
          >abrir aparte ↗</a
        >
      </div>
      <div class="version after">
        <span class="badge">AHORA</span>
        <a
          class="open"
          href="https://ad-engine-lab.pages.dev/"
          target="_blank"
          rel="noopener"
          >abrir aparte ↗</a
        >
      </div>
    </header>
    <main class="compare">
      <section class="pane" aria-label="Versión con 30 créditos">
        <iframe
          title="Versión anterior con 30 créditos"
          src="https://2ed94ed6.ad-engine-lab.pages.dev/"
        ></iframe>
      </section>
      <section class="pane" aria-label="Versión anterior">
        <iframe
          title="Versión anterior con planes"
          src="https://ea084497.ad-engine-lab.pages.dev/"
        ></iframe>
      </section>
      <section class="pane" aria-label="Versión actual">
        <iframe
          title="Versión actual de la landing page"
          src="https://ad-engine-lab.pages.dev/"
        ></iframe>
      </section>
    </main>
  </body>
</html>
